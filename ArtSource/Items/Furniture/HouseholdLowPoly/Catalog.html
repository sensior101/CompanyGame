const cat=document.querySelector('#category');[...new Set(items.map(x=>x.category))].forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;cat.append(o)});
Object.entries(labels).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v;b.dataset.color=k;b.onclick=()=>{palette=k;render()};document.querySelector('#colors').append(b)});
function render(){const q=document.querySelector('#search').value.toLowerCase();const shown=items.filter(x=>(!cat.value||x.category===cat.value)&&(x.label+' '+x.id).toLowerCase().includes(q));document.querySelector('#count').textContent=shown.length+'개';document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',b.dataset.color===palette));document.querySelector('#grid').innerHTML=shown.map(x=>`<article><img loading="lazy" src="QA/${x.id}/${palette}.png" alt="${x.label}"><div class="body"><h2>${x.label}</h2><div class="meta">${x.category} · ${x.triangles.toLocaleString()} tris<br>폭 ${x.dimensions[0].toFixed(2)} × 깊이 ${x.dimensions[1].toFixed(2)} × 높이 ${x.dimensions[2].toFixed(2)} m</div><a href="Models/${x.id}.blend">Blender 원본</a><a href="Exports/${x.id}/${x.id}_${palette}.fbx">FBX</a><a href="Exports/${x.id}/${x.id}_${palette}.glb">GLB</a></div></article>`).join('')};document.querySelector('#search').oninput=render;cat.onchange=render;render();</script></html>
